name: publish

# Stages the bundle on npm as `dsh-atpet`.
#
# Trigger by pushing a version tag (`git tag v1.1.0 && git push origin v1.1.0`)
# or manually from the Actions tab. The job runs the zero-dependency behaviour
# tests first, then stages the packed tarball; a failing test never reaches the
# registry.
#
# npm's current policy for accounts with 2FA: granular tokens that bypass 2FA
# may only publish to the staging area, so this workflow deliberately does NOT
# publish directly. After it succeeds, a maintainer approves the staged version
# with a second factor:
#
#   npm stage list                   # find the stage id / version
#   npm stage approve <stage-id>     # 2FA prompt, then the version goes live
#
# Requires a repository secret NPM_TOKEN: a granular access token with
# "Read and write (stage only)" permission for `dsh-atpet`.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Test
        run: node test/bridge.test.mjs

      - name: Check the packed tarball
        run: npm pack --dry-run

      - name: Stage on npm
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          npm stage publish --access public --provenance 2>&1 | tee "$RUNNER_TEMP/stage.log"
          id="$(sed -n 's/.*staged with id \([0-9a-f-]*\).*/\1/p' "$RUNNER_TEMP/stage.log" | tail -1)"
          echo "stage-id=$id" >> "$GITHUB_OUTPUT"
          {
            echo "### Staged dsh-atpet for review"
            echo
            echo "Approve with 2FA to publish:"
            echo '```'
            echo "npm stage approve $id"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
